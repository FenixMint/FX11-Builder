# FX Linux Calamares profile.
# Prototype only: shows the integrated partition workflow but does not execute disk changes yet.
---
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- show:
  - finished

branding: fx-linux
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
