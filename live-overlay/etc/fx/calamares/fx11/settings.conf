# FX11 phase-1 Calamares profile.
# Prototype only: no destructive exec phase is enabled yet.
---
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - summary
- show:
  - finished

branding: fx11
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
