-- FenixSystem / Fedora 44 KDE Plasma 6.7.5 / Wayland (candidate validated for visibility without window hints; layout revision pending visual test).
-- Preserves ThinFedora layout; sensors and network are fault-tolerant KDE helpers.

conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'DejaVu Sans Mono:size=11',
    gap_x = 30,
    gap_y = 90,
    minimum_height = 520,
    minimum_width = 360,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

conky.text = [[
${font DejaVu Sans:bold:size=16}FenixSystem${font}
${hr 2}

${font DejaVu Sans:bold:size=11}SYSTEM${font}

CPU ${alignr}${cpu}%   ${execi 60 nproc}T
${cpubar 7}

T01 ${cpu cpu1}%${alignr}T02 ${cpu cpu2}%
T03 ${cpu cpu3}%${alignr}T04 ${cpu cpu4}%
T05 ${cpu cpu5}%${alignr}T06 ${cpu cpu6}%
T07 ${cpu cpu7}%${alignr}T08 ${cpu cpu8}%
T09 ${cpu cpu9}%${alignr}T10 ${cpu cpu10}%
T11 ${cpu cpu11}%${alignr}T12 ${cpu cpu12}%

RAM ${alignr}${memperc}%   ${mem} / ${memmax}
${membar 7}

SSD ${alignr}${fs_used_perc /}%   ${fs_used /} / ${fs_size /}
${fs_bar 7 /}

${font DejaVu Sans:bold:size=11}THERMAL${font}

${execpi 5 ~/.local/bin/fenix-sensors-kde.sh}

${font DejaVu Sans:bold:size=11}BATTERY${font}

Battery ${alignr}${battery_percent BAT0}%

${font DejaVu Sans:bold:size=11}NETWORK${font}

${execpi 5 ~/.local/bin/fenix-network-kde.sh}

${hr 2}

Uptime ${alignr}${uptime_short}
]]
