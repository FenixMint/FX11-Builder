name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest

  debian-smoke:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y git python3 python3-venv python3-pip wimtools xorriso
      - uses: actions/checkout@v4
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -e '.[dev]'
      - run: .venv/bin/pytest
      - run: .venv/bin/fx11 doctor
      - run: chmod +x tests/e2e_synthetic.sh && PATH="$PWD/.venv/bin:$PATH" tests/e2e_synthetic.sh
